name: CI

on:
  push:
    branches: ['main', 'claude/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests + coverage gate
        run: npm run coverage

      - name: Golden-master synthetic fixtures
        run: npm run gm -- packages/golden-master/fixtures/synthetic

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bodhi
          POSTGRES_PASSWORD: bodhi
          POSTGRES_DB: bodhi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bodhi -d bodhi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://bodhi:bodhi@localhost:5432/bodhi
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Integration tests (Postgres + Redis)
        run: npm run test:integration
